name: Appli

# Fabrique l'appli Sensor Maps (dossier appli), l'essaie sur un téléphone virtuel,
# puis la publie sur la page « Releases » du dépôt, sous la version fixe « appli ».
# Le lien d'installation ne change jamais :
# https://github.com/loSCripts/sensor-maps/releases/download/appli/sensor-maps.apk
on:
  push:
    paths:
      - 'appli/**'
      - '.github/workflows/appli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appli
  cancel-in-progress: true

jobs:
  apk:
    name: Fabriquer l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Les outils Android sont déjà sur les serveurs de GitHub : on ajoute seulement la version 17.
      - name: Ajouter Android 17 aux outils Android
        run: |
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkm" ] || sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      # Le numéro du passage devient le numéro de version : chaque APK s'installe par-dessus le précédent
      - name: Fabriquer l'APK
        env:
          NUMERO_VERSION: ${{ github.run_number }}
        run: gradle -p appli assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp appli/build/outputs/apk/release/sensor-maps-release.apk sensor-maps.apk

      - name: Garder l'APK pour les étapes suivantes
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: sensor-maps.apk
          retention-days: 7

  essai:
    name: Essai sur un téléphone virtuel
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Permettre à l'émulateur d'utiliser la virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer le téléphone virtuel et l'essai
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash appli/essai-emulateur.sh sensor-maps.apk

      - name: Garder les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: ecran-*.png
          retention-days: 7
          if-no-files-found: ignore

  publication:
    name: Publier dans Releases
    needs: essai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      # Une seule version fixe, « appli », remplacée à chaque fois : le lien reste le même.
      # Elle n'est pas marquée « la plus récente », pour ne pas casser le lien de l'appli de test.
      - name: Remplacer la release « appli »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete appli --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/appli" > /dev/null 2>&1 || true
          gh release create appli sensor-maps.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Sensor Maps, version ${{ github.run_number }}" \
            --latest=false \
            --notes "Appli Sensor Maps, version maquette-${{ github.run_number }} : l'interface, avec des chiffres pour l'exemple. Sur le téléphone, touche sensor-maps.apk juste en dessous pour la télécharger, puis ouvre le fichier pour l'installer. Avant d'être publiée, elle a été essayée sur un téléphone virtuel Android 15 : aucun plantage."
